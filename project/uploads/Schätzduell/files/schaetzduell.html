<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D2B2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Schätzduell</title>
<style>
  /* ============ Schriften: lokal gebündelt, offline-fest ============
     Erwartet vier Dateien im Ordner ./fonts/ neben dieser Datei.
     Fehlen sie, greift automatisch der Systemfont-Fallback. ============ */
  @font-face{font-family:"Archivo";src:url("fonts/Archivo-Variable.woff2") format("woff2-variations"),
    url("fonts/Archivo-Variable.woff2") format("woff2");
    font-weight:100 900;font-style:normal;font-display:swap}
  @font-face{font-family:"Archivo Black";src:url("fonts/ArchivoBlack-Regular.woff2") format("woff2");
    font-weight:400 900;font-style:normal;font-display:swap}
  @font-face{font-family:"DM Mono";src:url("fonts/DMMono-Regular.woff2") format("woff2");
    font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"DM Mono";src:url("fonts/DMMono-Medium.woff2") format("woff2");
    font-weight:500;font-style:normal;font-display:swap}
</style>
<style>
  :root{
    --petrol:#0D2B2F; --petrol-2:#12393E; --petrol-3:#1B4C52;
    --cream:#F3EADA; --amber:#F0B429; --dim:rgba(243,234,218,.55);
    --line:rgba(243,234,218,.15);
    --display:"Archivo Black","Archivo","Helvetica Neue",system-ui,sans-serif;
    --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  /* Ohne geladene Fontdateien fällt der Display-Stack auf einen Systemfont
     zurück – Gewicht 900 sorgt dafür, dass er trotzdem fett aussieht. */
  .wm,h2,.chip,.stepper .cnt b,.seg button,.cat .t1,.question,.turn b,.truth .val,
  .row .who,.row .pt,.champ .name,.score .big,.score .band,.statgrid .v{font-weight:900}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--petrol);color:var(--cream);font-family:var(--body);font-size:16px;
    line-height:1.45;display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #app{width:100%;max-width:540px;display:flex;flex-direction:column;min-height:100dvh;padding:16px 16px 22px}
  .main{flex:1;display:flex;flex-direction:column}
  .spacer{flex:1;min-height:16px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

  /* ================= Logo-Lockup ================= */
  .lock{display:flex;flex-direction:column;align-items:center;text-align:center;margin:10px 0 26px;user-select:none}
  .mark{width:74px;height:74px;border-radius:20px;overflow:hidden;
        box-shadow:0 10px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(243,234,218,.08)}
  .mark .truthbar{transform-origin:center;animation:grow .7s cubic-bezier(.2,1,.3,1) both}
  .mark .cvA{animation:inA .9s cubic-bezier(.2,1,.3,1) .12s both}
  .mark .cvB{animation:inB .9s cubic-bezier(.2,1,.3,1) .12s both}
  @keyframes grow{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:scaleY(1)}}
  @keyframes inA{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @keyframes inB{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}

  .wm{font-family:var(--display);font-size:clamp(38px,12.5vw,56px);line-height:.84;
      letter-spacing:-.045em;text-transform:uppercase;margin-top:16px}
  .wm .d{display:block;color:var(--amber)}
  .rule{width:100%;max-width:280px;height:12px;margin-top:14px;opacity:.9}
  .rule line{stroke:rgba(243,234,218,.26);stroke-width:1}
  .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--dim);margin-top:11px}

  /* kompakte Kopfzeile in Screen 2 */
  .lock.sm{margin:2px 0 20px}
  .lock.sm .mark{width:44px;height:44px;border-radius:12px}
  .lock.sm .wm{font-size:26px;margin-top:10px}
  .lock.sm .rule,.lock.sm .tag{display:none}

  .steps{display:flex;gap:6px;margin-bottom:20px}
  .step{flex:1;height:3px;background:rgba(243,234,218,.13);border-radius:2px}
  .step.on{background:var(--amber)}

  h2{font-family:var(--display);font-size:22px;line-height:1.1;text-transform:uppercase;
     letter-spacing:-.015em;margin-bottom:4px}
  .sub{color:var(--dim);font-size:13.5px;margin-bottom:18px}
  .flabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);margin:0 0 8px}

  /* Stepper + Segmented */
  .stepper{display:flex;align-items:center;gap:14px;background:var(--petrol-2);
    border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:18px}
  .stepper button{width:44px;height:44px;flex:none;border-radius:9px;font-size:23px;padding:0;line-height:1}
  .stepper .cnt{flex:1;text-align:center}
  .stepper .cnt b{font-family:var(--display);font-size:32px;display:block;line-height:1}
  .stepper .cnt span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--dim)}
  .seg{display:flex;gap:8px;margin-bottom:20px}
  .seg button{background:var(--petrol-2);border:1px solid var(--line);color:var(--dim);
    font-family:var(--display);font-size:15px;padding:15px 10px;letter-spacing:0}
  .seg button small{display:block;font-family:var(--mono);font-size:9.5px;font-weight:400;
    letter-spacing:.14em;margin-top:3px;opacity:.8;text-transform:uppercase}
  .seg button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#0D2B2F}

  .names{display:flex;flex-direction:column;gap:8px}
  .nrow{display:flex;align-items:center;gap:11px}
  .chip{width:26px;height:26px;border-radius:8px;flex:none;font-family:var(--display);
    font-size:12px;display:flex;align-items:center;justify-content:center;color:#0D2B2F}
  input[type=text]{width:100%;background:var(--petrol-2);border:1px solid var(--line);
    border-radius:10px;color:var(--cream);font-family:var(--body);font-weight:600;
    font-size:17px;padding:12px 15px}
  input[type=text]::placeholder{color:rgba(243,234,218,.3)}
  input[type=text]:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}

  .cats{display:flex;flex-direction:column;gap:8px}
  .cat{display:flex;align-items:center;gap:13px;background:var(--petrol-2);
    border:1px solid var(--line);border-radius:12px;padding:12px 15px;cursor:pointer;
    transition:border-color .15s,background .15s}
  .cat[aria-pressed="true"]{border-color:var(--amber);background:var(--petrol-3)}
  .cat .box{width:20px;height:20px;flex:none;border-radius:6px;border:1.5px solid var(--dim);
    display:flex;align-items:center;justify-content:center}
  .cat[aria-pressed="true"] .box{background:var(--amber);border-color:var(--amber)}
  .cat .box svg{opacity:0;width:12px;height:12px}
  .cat[aria-pressed="true"] .box svg{opacity:1}
  .cat .txt{flex:1;text-align:left;min-width:0}
  .cat .t1{display:block;font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:-.01em}
  .cat .t2{display:block;font-size:12.5px;color:var(--dim);line-height:1.35;font-weight:500}
  .cat .n{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
  .allbtn{background:transparent;border:1px dashed var(--line);color:var(--dim);
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;padding:13px;font-weight:400}
  .allbtn.on{border-style:solid;border-color:var(--amber);color:var(--amber)}

  button{font-family:var(--body);font-weight:800;font-size:15.5px;letter-spacing:.03em;
    text-transform:uppercase;background:var(--amber);color:#0D2B2F;border:0;border-radius:10px;
    padding:16px;width:100%;cursor:pointer;transition:transform .12s,opacity .12s}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.3;cursor:default}
  button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
  .ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:600}
  .link{background:none;border:0;color:var(--dim);font-family:var(--mono);font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;padding:11px;width:auto;margin:0 auto;display:block}

  .board{display:grid;gap:7px 10px;padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .slot .nm{display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);
    font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
  .slot .nm i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot .bar{height:5px;background:rgba(243,234,218,.12);border-radius:3px;overflow:hidden}
  .slot .bar i{display:block;height:100%;border-radius:3px;transition:width .45s cubic-bezier(.3,1,.4,1)}

  .qmeta{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}
  .question{font-family:var(--display);font-size:clamp(22px,6vw,30px);line-height:1.14;
    letter-spacing:-.012em;margin-bottom:7px}
  .unit{font-family:var(--mono);font-size:13px;color:var(--amber);letter-spacing:.06em}
  .turn{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .turn b{font-family:var(--display);font-size:19px;text-transform:uppercase;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .turn .of{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:auto;flex:none}
  .guess{font-family:var(--mono)!important;font-size:31px!important;text-align:center;letter-spacing:.04em}
  .guess.mask{-webkit-text-security:disc}
  .hint{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:center;
    margin-top:11px;line-height:1.6}

  .truth{text-align:center;margin:4px 0}
  .truth .val{font-family:var(--display);font-size:clamp(34px,11vw,52px);line-height:1.05;
    color:var(--amber);letter-spacing:-.025em}
  .truth .u{font-family:var(--mono);font-size:12.5px;color:var(--dim);letter-spacing:.06em}
  .strahl{position:relative;height:84px;margin:14px 0 2px}
  .axis{position:absolute;left:0;right:0;top:14px;height:1px;background:var(--line)}
  .tick{position:absolute;top:2px;width:2px;height:25px;background:var(--amber);transform:translateX(-1px)}
  .peg{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
  .peg .stem{width:1px;background:currentColor;opacity:.45}
  .peg .bub{font-family:var(--mono);font-size:10px;font-weight:500;padding:1px 5px;border-radius:4px;
    background:currentColor;color:#0D2B2F;white-space:nowrap}
  .rows{border-top:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:9px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .row .who{font-family:var(--display);font-size:15px;text-transform:uppercase;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .gv{font-family:var(--mono);font-size:16px}
  .row .diff{font-family:var(--mono);font-size:10.5px;color:var(--dim);width:74px;text-align:right}
  .row .pt{font-family:var(--display);font-size:12px;width:26px;text-align:right;opacity:0}
  .row.win .pt{opacity:1}

  .champ{text-align:center;padding:22px 0}
  .champ .name{font-family:var(--display);font-size:clamp(36px,12vw,60px);line-height:.94;
    text-transform:uppercase;letter-spacing:-.03em}
  .final{font-family:var(--mono);font-size:13.5px;color:var(--dim);margin-top:20px;line-height:1.95}

  /* ---------- Übungsmodus ---------- */
  .solohead{display:flex;align-items:center;gap:11px;padding-bottom:11px;
    border-bottom:1px solid var(--line);margin-bottom:14px}
  .solohead .sc{font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    color:var(--dim);white-space:nowrap}
  .solohead .prog{flex:1;height:5px;background:rgba(243,234,218,.12);border-radius:3px;overflow:hidden}
  .solohead .prog i{display:block;height:100%;background:var(--amber);border-radius:3px;
    transition:width .45s cubic-bezier(.3,1,.4,1)}
  .cmp{display:flex;gap:9px;margin-top:16px}
  .cmp>div{flex:1;background:var(--petrol-2);border:1px solid var(--line);
    border-radius:11px;padding:11px 8px;text-align:center;min-width:0}
  .cmp .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim)}
  .cmp .v{font-family:var(--mono);font-size:18px;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score{text-align:center;margin:20px 0 4px}
  .score .big{font-family:var(--display);font-size:54px;line-height:1;letter-spacing:-.03em}
  .score .band{font-family:var(--display);font-size:14px;text-transform:uppercase;
    letter-spacing:.06em;margin-top:7px}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}
  .statgrid>div{background:var(--petrol-2);border:1px solid var(--line);
    border-radius:11px;padding:13px;text-align:center}
  .statgrid .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim)}
  .statgrid .v{font-family:var(--display);font-size:24px;margin-top:4px}

  .links{display:flex;gap:6px;justify-content:center;align-items:center}
  .links .link{margin:0}
  .links .sep{color:rgba(243,234,218,.22);font-size:11px}
  .resume{display:flex;align-items:center;gap:12px;background:var(--petrol-3);
    border:1px solid var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:18px;
    text-align:left;cursor:pointer;width:100%}
  .resume .rt{flex:1;min-width:0}
  .resume .r1{font-family:var(--display);font-weight:900;font-size:14px;
    text-transform:uppercase;letter-spacing:-.01em;color:var(--cream)}
  .resume .r2{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
  .resume .arr{color:var(--amber);font-size:20px;flex:none;font-family:var(--mono)}
  .best{font-family:var(--mono);font-size:11px;color:var(--dim);
    letter-spacing:.04em;margin-top:-8px;margin-bottom:18px}

  .fade{animation:fade .26s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ================= Speicher =================
   Reihenfolge: Artefakt-Storage → Gerätespeicher → nur im Arbeitsspeicher.
   Jede Ebene ist gekapselt, ein Fehler bricht das Spiel nie ab. */
const MEM={};
const STORE={
  async get(k){
    try{
      if(typeof window!=="undefined"&&window.storage){
        const r=await window.storage.get(k); return r&&r.value?JSON.parse(r.value):null;
      }
      const v=localStorage.getItem("sd:"+k); return v?JSON.parse(v):null;
    }catch(e){ return MEM[k]!==undefined?MEM[k]:null }
  },
  async set(k,v){
    MEM[k]=v;
    try{
      if(typeof window!=="undefined"&&window.storage){
        await window.storage.set(k,JSON.stringify(v)); return;
      }
      localStorage.setItem("sd:"+k,JSON.stringify(v));
    }catch(e){}
  },
  async del(k){
    delete MEM[k];
    try{
      if(typeof window!=="undefined"&&window.storage){ await window.storage.delete(k); return }
      localStorage.removeItem("sd:"+k);
    }catch(e){}
  }
};

function start(){
  S.pool=shuffle(Q.map((_,i)=>i).filter(i=>S.cats.includes(Q[i][0])));

  if(S.mode==="solo") return soloAsk();
  S.players=S.names.map(n=>({name:n,score:0}));
  ask();
}

/* ================= Übungsmodus ================= */
function accuracy(g,a){
  let p;
  if(a>0&&g>0){
    const r=Math.max(g/a,a/g);
    p=100*(1-Math.log10(r)/1.3);
  }else{
    p=100*(1-Math.abs(g-a)/Math.max(Math.abs(a),1));
  }
  return Math.max(0,Math.min(100,Math.round(p)));
}
function bandOf(p){
  if(p>=95) return ["Volltreffer","#5FBF8B"];
  if(p>=80) return ["Stark","#A3C940"];
  if(p>=60) return ["Solide","#F0B429"];
  if(p>=35) return ["Naja","#E8703A"];
  return ["Daneben","#E2553C"];
}
function soloLen(){return Math.min(S.len,S.pool.length)}
function soloHead(){
  const done=S.results.length, len=soloLen();
  const pts=S.results.reduce((a,r)=>a+r.p,0);
  return `<div class="solohead">
    <span class="sc">${done} / ${len}</span>
    <span class="prog"><i style="width:${done/len*100}%"></i></span>
    <span class="sc">${pts} Pkt</span></div>`;
}

function soloAsk(){
  saveGame();
  const [c,text,,unit]=Q[S.pool[S.qi]];
  app.innerHTML=`${soloHead()}
  <div class="main fade">
    <div class="qmeta"><div class="eyebrow">Übung</div>
      <div class="eyebrow" style="text-align:right">${esc(CATS[c].k)}</div></div>

    <input type="text" id="g" class="guess" inputmode="decimal" autocomplete="off"
      placeholder="?" style="margin-top:26px">

    <button id="ok" disabled>Auflösen</button>
    <div class="links" style="margin-top:4px">
      <button class="link" id="skip">Frage überspringen</button>
      <span class="sep">·</span>
      <button class="link" id="stop">Übung beenden</button>
    </div>
  </div>`;
  const g=document.getElementById("g"), ok=document.getElementById("ok");
  const val=()=>parseFloat(g.value.replace(/\./g,"").replace(",","."));
  g.addEventListener("input",()=>{g.value=g.value.replace(/[^0-9.,-]/g,"");ok.disabled=!isFinite(val())});
  g.addEventListener("keydown",e=>{if(e.key==="Enter"&&!ok.disabled)ok.click()});
  ok.onclick=()=>soloReveal(val());
  document.getElementById("skip").onclick=()=>{
    S.qi++;
    if(S.qi>=S.pool.length) return S.results.length?soloEnd():setup();
    soloAsk();
  };
  document.getElementById("stop").onclick=()=>S.results.length?soloEnd():(clearSave(),setup());
  g.focus();
}

function soloReveal(guess){
  const [c,text,ans,unit]=Q[S.pool[S.qi]];
  const p=accuracy(guess,ans);
  const [band,col]=bandOf(p);
  S.results.push({q:text,guess,ans,unit,p});
  const off=ans!==0?Math.round((guess-ans)/Math.abs(ans)*100):0;

  app.innerHTML=`${soloHead()}
  <div class="main fade">
    <div class="qmeta"><div class="eyebrow">Übung</div>
      <div class="eyebrow" style="text-align:right">${esc(CATS[c].k)}</div></div>
    <div style="font-size:14.5px;color:var(--dim);margin-bottom:10px">${esc(text)}</div>
    <div class="truth"><div class="eyebrow">Richtige Antwort</div>
      <div class="val">${nf(ans)}</div><div class="u">${esc(unit)}</div></div>
    <div class="cmp">
      <div><div class="k">Dein Tipp</div><div class="v">${nf(guess)}</div></div>
      <div><div class="k">Abweichung</div><div class="v">${off>0?"+":""}${nf(off)} %</div></div>
    </div>
    <div class="score">
      <div class="big" style="color:${col}">+${p}</div>
      <div class="band" style="color:${col}">${band}</div>
    </div>
    <div class="spacer"></div>
    <button id="next">${S.results.length>=soloLen()?"Auswertung":"Nächste Frage"}</button>
  </div>`;
  document.getElementById("next").onclick=()=>{
    if(S.results.length>=soloLen()) return soloEnd();
    S.qi++; soloAsk();
  };
}

function soloEnd(){
  clearSave();
  const n=S.results.length;
  const pts=S.results.reduce((a,r)=>a+r.p,0);
  const pct=Math.round(pts/(n*100)*100);
  const hits=S.results.filter(r=>r.p>=95).length;
  const best=S.results.reduce((a,r)=>r.p>a.p?r:a);
  const worst=S.results.reduce((a,r)=>r.p<a.p?r:a);
  const title = pct>=90?"Schätz-Legende" : pct>=75?"Feines Gespür"
              : pct>=60?"Solide Nase"    : pct>=40?"Ausbaufähig" : "Glückssache";

  STATS=STATS||{runden:0,fragen:0};
  STATS.runden=(STATS.runden||0)+1;
  STATS.fragen=(STATS.fragen||0)+n;
  const key="best"+S.len, prev=STATS[key]||0, rekord = n===S.len && pct>prev;
  if(rekord) STATS[key]=pct;
  STORE.set(K_STATS,STATS);

  app.innerHTML=`<div class="main fade">
    <div class="champ" style="padding:18px 0 4px">
      <div class="eyebrow">${rekord?"Neuer Bestwert":"Trefferquote"}</div>
      <div class="name" style="color:var(--amber)">${pct} %</div>
      <div class="final" style="margin-top:12px">${esc(title)}${
        !rekord&&prev?`<br><span style="opacity:.7">Bestwert ${S.len} Fragen: ${prev} %</span>`:""}</div>
    </div>
    <div class="statgrid">
      <div><div class="k">Punkte</div><div class="v">${pts}</div></div>
      <div><div class="k">von</div><div class="v">${n*100}</div></div>
      <div><div class="k">Volltreffer</div><div class="v">${hits}</div></div>
      <div><div class="k">Fragen</div><div class="v">${n}</div></div>
    </div>
    <div class="rows" style="margin-top:20px">
      <div class="row"><span class="dot" style="background:#5FBF8B"></span>
        <span class="who" style="font-family:var(--body);font-weight:600;text-transform:none;font-size:13px">${esc(best.q)}</span>
        <span class="gv" style="color:#5FBF8B">${best.p}</span></div>
      <div class="row"><span class="dot" style="background:#E2553C"></span>
        <span class="who" style="font-family:var(--body);font-weight:600;text-transform:none;font-size:13px">${esc(worst.q)}</span>
        <span class="gv" style="color:#E2553C">${worst.p}</span></div>
    </div>
    <div class="spacer"></div>
    <button id="again">Neue Übungsrunde</button>
    <button class="ghost" id="home" style="margin-top:10px">Zurück zum Start</button>
  </div>`;
  document.getElementById("again").onclick=start;
  document.getElementById("home").onclick=setup;
}

function board(){
  const p=S.players.length;
  const cols=p<=3?p:(p<=4?2:(p<=6?3:4));
  return `<div class="board" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">

      <div class="nm" style="color:${COL[i]}"><i>${esc(pl.name)}</i><em style="font-style:normal">${pl.score}</em></div>
      <div class="bar"><i style="width:${Math.min(100,pl.score/S.target*100)}%;background:${COL[i]}"></i></div>
    </div>`).join("")}</div>`;
}

    <div class="hint">${last?"Danach werden alle Tipps aufgedeckt":"Handy weitergeben an "+esc(S.players[S.turn+1].name)}</div>
  </div>`;
  const g=document.getElementById("g"), ok=document.getElementById("ok");
  const val=()=>parseFloat(g.value.replace(/\./g,"").replace(",","."));
  g.addEventListener("input",()=>{g.value=g.value.replace(/[^0-9.,-]/g,"");ok.disabled=!isFinite(val())});
  g.addEventListener("keydown",e=>{if(e.key==="Enter"&&!ok.disabled)ok.click()});
  document.getElementById("tog").onclick=()=>{S.mask=!S.mask;g.classList.toggle("mask",S.mask);
    document.getElementById("tog").textContent=S.mask?"Zahl anzeigen":"Zahl verdecken";g.focus()};
  const sk=document.getElementById("skip");
  if(sk) sk.onclick=()=>{
    S.qi++; S.guesses=[];
    if(S.qi>=S.pool.length) return win();
    ask();
  };
  ok.onclick=()=>{
    S.guesses.push(val());
    if(!last){S.turn++;ask()} else {S.turn=0;reveal()}
  };
  g.focus();
}

function reveal(){
  const [c,text,ans,unit]=Q[S.pool[S.qi]];
  const diffs=S.guesses.map(v=>Math.abs(v-ans));
  const best=Math.min(...diffs);
  diffs.forEach((d,i)=>{if(d===best)S.players[i].score++});

  const all=[ans,...S.guesses];
  let lo=Math.min(...all), hi=Math.max(...all);
  if(hi===lo){lo-=1;hi+=1}
  const pad=(hi-lo)*.1; lo-=pad; hi+=pad;
  const pos=v=>((v-lo)/(hi-lo))*100;
  const lanes=[0,20,40];
  const order=S.guesses.map((v,i)=>({i,v,d:diffs[i]})).sort((a,b)=>a.d-b.d);

  app.innerHTML=`${board()}
  <div class="main fade">
    <div class="qmeta"><div class="eyebrow">Frage ${S.qi+1} · bis ${S.target}</div>
      <div class="eyebrow" style="text-align:right">${esc(CATS[c].k)}</div></div>
    <div style="font-size:14.5px;color:var(--dim);margin-bottom:10px">${esc(text)}</div>
    <div class="truth"><div class="eyebrow">Richtige Antwort</div>
      <div class="val">${nf(ans)}</div><div class="u">${esc(unit)}</div></div>
    <div class="strahl">
      <div class="axis"></div><div class="tick" style="left:${pos(ans)}%"></div>
      ${S.guesses.map((v,i)=>{const lane=lanes[i%3];
        return `<div class="peg" style="left:${pos(v)}%;top:${15+lane}px;color:${COL[i]}">
          <div class="stem" style="height:${lane?7:4}px"></div>
          <div class="bub">${esc(S.players[i].name.slice(0,3).toUpperCase())}</div></div>`}).join("")}
    </div>
    <div class="rows">
      ${order.map(o=>`<div class="row ${o.d===best?"win":""}">
        <span class="dot" style="background:${COL[o.i]}"></span>
        <span class="who" style="color:${COL[o.i]}">${esc(S.players[o.i].name)}</span>
        <span class="gv">${nf(o.v)}</span>
        <span class="diff">${o.d===0?"exakt":"±"+nf(Math.round(o.d*1000)/1000)}</span>
        <span class="pt" style="color:${COL[o.i]}">+1</span></div>`).join("")}
    </div>
    <div class="spacer"></div>
    <button id="next">Weiter</button>
  </div>`;
  document.getElementById("next").onclick=()=>{
    if(S.players.some(p=>p.score>=S.target)) return win();
    S.qi++; S.guesses=[];
    if(S.qi>=S.pool.length) return win();
    ask();
  };
}

function win(){
  clearSave();
  const top=Math.max(...S.players.map(p=>p.score));
  const champs=S.players.map((p,i)=>({p,i})).filter(o=>o.p.score===top);
  const rank=S.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score);
  app.innerHTML=`${board()}
  <div class="main fade">
    <div class="champ">
      <div class="eyebrow">${champs.length>1?"Unentschieden":"Sieger"}</div>
      <div class="name" style="color:${champs.length>1?"var(--cream)":COL[champs[0].i]}">
        ${champs.map(o=>esc(o.p.name)).join("<br>")}</div>
      <div class="final">${rank.map(o=>`<span style="color:${COL[o.i]}">${esc(o.p.name)}</span> — ${o.p.score}`).join("<br>")}</div>
    </div>
    <div class="spacer"></div>
    <button id="same">Nochmal, gleiche Runde</button>
    <button class="ghost" id="again" style="margin-top:10px">Neu einrichten</button>
  </div>`;
  document.getElementById("again").onclick=setup;
  document.getElementById("same").onclick=start;
}

async function boot(){
  try{
    const [sv,st]=await Promise.all([STORE.get(K_SAVE),STORE.get(K_STATS)]);
    SAVE = (sv && sv.pool && sv.pool.length) ? sv : null;
    STATS = st || null;
    if(SAVE){
      S.mode=SAVE.mode; S.target=SAVE.target; S.len=SAVE.len;
      S.n=SAVE.n; S.names=SAVE.names||[]; S.cats=SAVE.cats||[0,1,2,3,4];
    }
  }catch(e){}
  setup();
}
boot();
</script>
